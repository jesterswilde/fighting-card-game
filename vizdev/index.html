<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fight studies — Card visual development</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script><script defer src="app.js"></script>
</head>
<body>
  <header class="masthead"><a href="./index.html" class="wordmark">CARD LAB<span>VISUAL DEVELOPMENT</span></a><span class="edition">6 STYLE / LAYOUT STUDIES</span></header>
  <main>
    <section class="controls" aria-label="Card preview controls">
      <div class="picker"><label for="card-picker">01 / SELECT A CARD</label><select id="card-picker"></select></div>
      <div class="step-controls"><button id="previous" aria-label="Previous card">←</button><button id="next" aria-label="Next card">→</button><button id="random" aria-keyshortcuts="R" title="Pick a random card (R)">Random · R ↗</button></div>
      <div class="art-control"><label class="upload" for="art-upload">+ Try your artwork<input id="art-upload" type="file" accept="image/*"></label><button id="clear-art" hidden>Clear art</button></div>
    </section>
    <div class="selection-line"><p id="selection-info" aria-live="polite"></p><span>Palettes apply to this fighting style · saved for this session</span></div>
    <section id="studies" class="studies" aria-label="Six card aesthetic studies"></section>
    <details class="source"><summary>Inspect the selected card’s source data</summary><pre id="source-data"></pre></details>
    <footer><span>FIGHT STUDIES / MATERIAL EXPLORATIONS</span><span>160 cards · Original game icons · No dependencies</span></footer>
  </main>
  <div id="icon-tooltip" role="tooltip" hidden></div>
</body>
</html>
